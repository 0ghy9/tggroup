<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Claw · 备用静态页</title>
  <style>
    :root{color-scheme:dark;--a:#7384ff;--b:#9a7bff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px Inter,"Microsoft YaHei",system-ui;background:radial-gradient(circle at 15% 10%,#5868d850,transparent 32%),radial-gradient(circle at 85% 80%,#8c58e640,transparent 28%),#0b1020;color:#eef2ff}.card{width:min(580px,calc(100% - 32px));padding:42px;border:1px solid #ffffff22;border-radius:24px;background:#10182ae8;box-shadow:0 24px 70px #0008;text-align:center}.mark{width:58px;height:58px;display:grid;place-items:center;margin:auto;border-radius:18px;background:linear-gradient(135deg,var(--a),var(--b));font-size:25px;font-weight:800;box-shadow:0 10px 25px #7785ff55}h1{margin:22px 0 10px;font-size:27px}p{line-height:1.7;color:#aebbd5}.badge{display:inline-block;margin-top:13px;padding:7px 12px;border-radius:999px;background:#173a33;color:#8ff0c8;font-size:13px}.meta{margin-top:28px;padding-top:20px;border-top:1px solid #ffffff14;color:#7f8eaa;font-size:12px}.link{display:inline-block;margin-top:22px;color:#bbc5ff;text-decoration:none}.link:hover{text-decoration:underline}</style>
</head>
<body><main class="card"><div class="mark">C</div><h1>备用静态页面已上线</h1><p>这是 Claw 的 GitHub / Cloudflare 发布链路测试页。<br>主链接轮转页面保持不变。</p><span class="badge">● 发布测试正常</span><div class="meta">页面生成时间：<span id="time">—</span></div><a class="link" href="./index.html">返回链接轮转首页</a></main><script>document.querySelector('#time').textContent=new Date().toLocaleString('zh-CN')</script></body>
</html>
